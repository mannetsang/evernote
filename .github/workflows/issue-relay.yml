# Wakes Claude on any activity in this repository: an issue or pull request
# opened, a comment on either, a pull request review, or an inline review
# comment.
#
# Claude can subscribe to one pull request's events in real time; GitHub offers
# no subscription to a whole repository. So this posts a comment on the
# long-lived relay pull request, which Claude is subscribed to, and that comment
# is the wake-up. Claude then reads the real issue or pull request — the comment
# is a doorbell, not the message.
#
# The relay pull request is the open one labelled `claude-relay` (not a fixed
# number), so it can be replaced without editing this file. If none is open,
# this step fails loudly rather than passing quietly: a relay that has
# silently stopped is worse than no relay at all.
#
# Same design as mannetsang/AmazCS and GenC-Beauty/genc-pos. Here the Jules
# webhook (jules-bridge.yml) delivers events to Jules, and Jules can open issues
# and pull requests, comment and review. The doorbell includes the
# <!-- jules --> marker so it is not sent back to the Jules webhook.
#
# Pull requests opened from forks get a read-only token from GitHub and cannot
# ring the relay; open them from a branch in this repository.

name: Issue relay

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  issues: write          # issue events arrive here
  pull-requests: write   # the doorbell is a comment on a pull request: GitHub
                         # checks the pull-requests permission for that, even
                         # through the issues API (read-only gives a 403)

concurrency:
  group: issue-relay
  cancel-in-progress: false

env:
  RELAY_LABEL: "claude-relay"

jobs:
  notify:
    # Things that must not wake Claude:
    #   - anything on the relay pull request itself, where this workflow writes
    #   - this workflow's own comments (github-actions[bot])
    #   - anything Claude wrote, which carries the <!-- claude --> marker: its
    #     replies, reviews, and the issues and pull requests it opens
    #
    # The marker rather than the author, because Claude may write through a
    # token belonging to a person — filtering by author would silently drop
    # that person's own messages, which are the ones that matter most. Other
    # bots are not filtered: Jules may post back through one, and its words
    # must still wake Claude.
    if: >-
      github.event.sender.login != 'github-actions[bot]' &&
      !contains(github.event.issue.labels.*.name, 'claude-relay') &&
      !contains(github.event.pull_request.labels.*.name, 'claude-relay') &&
      !contains(github.event.comment.body || '', '<!-- claude -->') &&
      !contains(github.event.review.body || '', '<!-- claude -->') &&
      !(github.event_name == 'issues' && contains(github.event.issue.body || '', '<!-- claude -->')) &&
      !(github.event_name == 'pull_request' && contains(github.event.pull_request.body || '', '<!-- claude -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Comment on the relay pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACT: ${{ github.event.action }}
          REVIEW_STATE: ${{ github.event.review.state }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          URL: ${{ github.event.comment.html_url || github.event.review.html_url || github.event.issue.html_url || github.event.pull_request.html_url }}
          WHO: ${{ github.event.sender.login }}
          IS_PR: ${{ github.event.pull_request != null || github.event.issue.pull_request != null }}
        run: |
          set -euo pipefail

          relay=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                       -H "Accept: application/vnd.github+json" \
                       "https://api.github.com/repos/$REPO/issues?state=open&labels=$RELAY_LABEL&per_page=5" \
                  | python3 -c 'import json,sys; xs=[i for i in json.load(sys.stdin) if i.get("pull_request")]; print(xs[0]["number"] if xs else "")')
          if [ -z "$relay" ]; then
            echo "No open pull request labelled '$RELAY_LABEL' — the relay is broken." >&2
            echo "Reopen the relay PR, or label a new open PR '$RELAY_LABEL'." >&2
            exit 1
          fi

          # Titles are written by anyone who can open an issue or pull request:
          # they go into the JSON as data through Python, never into a shell string.
          python3 - <<'PY' > body.json
          import json, os
          e = os.environ
          kind = "PR" if e["IS_PR"] == "true" else "Issue"
          what = {
              "issues": e["ACT"],
              "pull_request": e["ACT"].replace("_", " "),
              "issue_comment": "commented on",
              "pull_request_review": f"reviewed ({e['REVIEW_STATE'].replace('_', ' ')})",
              "pull_request_review_comment": "got an inline review comment",
          }.get(e["EVENT"], e["EVENT"])
          print(json.dumps({"body":
            f"**{kind} #{e['NUM']} {what}** by @{e['WHO']}\n\n"
            f"{e['TITLE']}\n\n"
            f"{e['URL']}\n\n"
            "_Relay only — read the issue or pull request itself; this comment is just the wake-up._\n\n<!-- jules -->"}))
          PY

          curl -sS -f -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data @body.json \
            "https://api.github.com/repos/$REPO/issues/$relay/comments" > /dev/null

          echo "Relayed $EVENT ($ACT) on #$NUM to relay PR #$relay"
